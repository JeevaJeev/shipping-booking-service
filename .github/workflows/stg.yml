name: Shipping Booking Service - STG CI/CD

on:
  push:
    branches:
      - stg
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  JAVA_VERSION: '17'
  APP_NAME: shipping-booking-service
  ENV_NAME: stg
  APP_PORT: '8082'
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/shipping-booking-service

jobs:
  build-test-deploy:
    name: Build, test and deploy to STG
    runs-on: ubuntu-latest
    environment: stg

    steps:
      - name: Checkout latest code from stg branch
        uses: actions/checkout@v4
        with:
          ref: stg

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Run Maven tests
        run: mvn -B clean test

      - name: Package application
        run: mvn -B package -DskipTests

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build -t $IMAGE_NAME:stg .
          docker tag $IMAGE_NAME:stg $IMAGE_NAME:stg-${{ github.sha }}

      - name: Push Docker image
        run: |
          docker push $IMAGE_NAME:stg
          docker push $IMAGE_NAME:stg-${{ github.sha }}

      - name: Deploy to STG server
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.STG_HOST }}
          username: ${{ secrets.STG_SSH_USER }}
          key: ${{ secrets.STG_SSH_KEY }}
          port: 22
          script: |
            set -e
            mkdir -p /opt/${{ env.APP_NAME }}/config
            cat > /opt/${{ env.APP_NAME }}/config/application-stg.properties <<EOF
            spring.application.name=${{ env.APP_NAME }}
            server.port=${{ env.APP_PORT }}
            spring.profiles.active=stg
            spring.datasource.url=${{ secrets.STG_DB_URL }}
            spring.datasource.username=${{ secrets.STG_DB_USERNAME }}
            spring.datasource.password=${{ secrets.STG_DB_PASSWORD }}
            spring.jpa.hibernate.ddl-auto=update
            spring.jpa.show-sql=false
            management.endpoints.web.exposure.include=health,info,metrics
            management.endpoint.health.show-details=always
            EOF

            docker pull $IMAGE_NAME:stg
            docker stop ${{ env.APP_NAME }}-stg || true
            docker rm ${{ env.APP_NAME }}-stg || true

            docker run -d \
              --name ${{ env.APP_NAME }}-stg \
              --restart unless-stopped \
              -p ${{ env.APP_PORT }}:${{ env.APP_PORT }} \
              -e SPRING_PROFILES_ACTIVE=stg \
              -e SERVER_PORT=${{ env.APP_PORT }} \
              -e SPRING_DATASOURCE_URL='${{ secrets.STG_DB_URL }}' \
              -e SPRING_DATASOURCE_USERNAME='${{ secrets.STG_DB_USERNAME }}' \
              -e SPRING_DATASOURCE_PASSWORD='${{ secrets.STG_DB_PASSWORD }}' \
              $IMAGE_NAME:stg

      - name: Smoke test STG health endpoint
        run: curl -fsS "http://${{ secrets.STG_HOST }}:${{ env.APP_PORT }}/actuator/health" | grep -q 'UP'
